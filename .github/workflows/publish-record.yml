name: Publish reviewed TRUEQ record
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-record.yml']
    branches: [main]
permissions:
  contents: write
concurrency:
  group: trueq-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Verify and publish exact reviewed files
        env:
          RECORD_SHA256: ea54cb517a1fe1c859abf78fd78029fd3d0273dff24d9698f46925def0c7de44
        run: python3 publish-record.py
